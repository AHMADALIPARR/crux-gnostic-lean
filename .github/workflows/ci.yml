name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  gnostic:
    name: Gnostic Arabic (lake build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gnostic-arabic-lean
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: lake build
        run: lake build

  crux:
    name: CRUX (lake build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crux-lean
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: lake build
        run: lake build
