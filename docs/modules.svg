  <text x="315" y="466" text-anchor="middle" font-size="10" fill="#475569">modules</text>

  <!-- outputs and nim -->
  <rect x="740" y="90" width="240" height="190" rx="10" fill="#f0fdf4" stroke="#334155" stroke-width="1.2"/>
  <text x="860" y="114" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">zig build outputs</text>
  <g font-family="Menlo, Consolas, monospace" fill="#0f172a">
    <text x="758" y="146">zig-out/bin/crux</text>
    <text x="758" y="176">zig-out/lib/libcrux.a</text>
    <text x="758" y="206">zig-out/include/crux.h</text>
  </g>
  <text x="758" y="240" fill="#475569">emits .smt2  .lean  .cu</text>
  <text x="758" y="260" fill="#475569">SAS reports, cert JSON</text>

  <rect x="740" y="360" width="240" height="150" rx="10" fill="#eff6ff" stroke="#334155" stroke-width="1.2"/>
  <text x="860" y="384" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">nim/  (Nim 2.4.2)</text>
  <g font-family="Menlo, Consolas, monospace" fill="#0f172a">
