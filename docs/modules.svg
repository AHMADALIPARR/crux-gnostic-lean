  <text x="145" y="563" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">gnostic-arabic-lean/</text>
  <text x="145" y="580" text-anchor="middle" font-size="11" font-family="Menlo, Consolas, monospace" fill="#0f172a">GnosticArabic/AbjadMatrix.lean</text>

