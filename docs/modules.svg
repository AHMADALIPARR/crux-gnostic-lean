    <line x1="240" y1="350" x2="372" y2="350"/>
    <line x1="240" y1="374" x2="372" y2="374"/>
    <line x1="240" y1="398" x2="372" y2="398"/>
    <line x1="240" y1="422" x2="372" y2="422"/>
