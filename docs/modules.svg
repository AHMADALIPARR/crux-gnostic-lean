    <path d="M660 508 L710 508 L710 176 L738 176"/>
    <line x1="860" y1="280" x2="860" y2="358"/>
  </g>
  <text x="872" y="324" fill="#475569">links libcrux.a,</text>
  <text x="872" y="340" fill="#475569">imports crux.h</text>
