  <rect x="0" y="0" width="1000" height="600" fill="#ffffff"/>
  <text x="500" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#0f172a">Repository map: Lean libraries, Zig compiler, Nim bindings</text>

