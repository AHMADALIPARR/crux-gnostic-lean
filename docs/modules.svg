    <text x="40" y="138">Crux/Russian.lean</text>
    <text x="40" y="162">Crux/Z3Backend.lean</text>
    <text x="40" y="186">Crux/LeanBackend.lean</text>
    <text x="40" y="210">Crux/LeanMonadStack.lean</text>
    <text x="40" y="234">Crux/TacticInfra.lean</text>
    <text x="40" y="258">Crux/SasBackend.lean</text>
    <text x="40" y="282">Crux/Omega.lean</text>
    <text x="40" y="306">Crux/Pcc.lean</text>
    <text x="40" y="330">Crux/Pipeline.lean</text>
    <text x="40" y="354">Crux/Domain.lean</text>
    <text x="40" y="378">Crux/Arithmetic.lean</text>
    <text x="40" y="402">Crux/Search.lean</text>
    <text x="40" y="426">Crux/Suspension.lean</text>
    <text x="40" y="460" fill="#475569">Crux.lean  (imports all 14)</text>
  </g>

  <!-- gnostic column -->
