<?xml version="1.0" encoding="UTF-8"?>
<!-- SPDX-License-Identifier: AGPL-3.0-only OR LicenseRef-SnapKitty-Opaque-1.0 -->
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <title>OMEGA smasher order</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="400" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#0f172a">OMEGA smasher: one goal, three provers in order</text>

  <rect x="20" y="80" width="150" height="70" rx="8" fill="#f1f5f9" stroke="#334155" stroke-width="1.2"/>
  <text x="95" y="110" text-anchor="middle" font-weight="bold" fill="#0f172a">goal</text>
  <text x="95" y="130" text-anchor="middle" font-size="12" fill="#0f172a">state + formula</text>

  <rect x="230" y="80" width="170" height="70" rx="8" fill="#fef3c7" stroke="#334155" stroke-width="1.2"/>
  <text x="315" y="106" text-anchor="middle" font-weight="bold" fill="#0f172a">1. Z3</text>
  <text x="315" y="125" text-anchor="middle" font-size="12" fill="#0f172a">z3 -smt2 on the query</text>
  <text x="315" y="141" text-anchor="middle" font-size="11" fill="#475569">only if z3 is on PATH</text>

  <rect x="460" y="80" width="190" height="70" rx="8" fill="#dcfce7" stroke="#334155" stroke-width="1.2"/>
  <text x="555" y="106" text-anchor="middle" font-weight="bold" fill="#0f172a">2. Lean</text>
  <text x="555" y="125" text-anchor="middle" font-size="12" fill="#0f172a">decide on ground goals,</text>
  <text x="555" y="141" text-anchor="middle" font-size="12" fill="#0f172a">then lean with --lean</text>

  <rect x="710" y="80" width="170" height="70" rx="8" fill="#fce7f3" stroke="#334155" stroke-width="1.2"/>
  <text x="795" y="106" text-anchor="middle" font-weight="bold" fill="#0f172a">3. SAS</text>
  <text x="795" y="125" text-anchor="middle" font-size="12" fill="#0f172a">interval fixpoint,</text>
  <text x="795" y="141" text-anchor="middle" font-size="12" fill="#0f172a">decides last</text>

  <g stroke="#475569" stroke-width="1.5" fill="none" marker-end="url(#a)">
    <line x1="170" y1="115" x2="228" y2="115"/>
    <line x1="400" y1="115" x2="458" y2="115"/>
    <line x1="650" y1="115" x2="708" y2="115"/>
  </g>
  <g font-size="11" fill="#475569" text-anchor="middle">
    <text x="429" y="106">Unknown</text>
    <text x="679" y="106">Unknown</text>
  </g>

  <g stroke="#475569" stroke-width="1.5" fill="none" marker-end="url(#a)">
    <line x1="315" y1="150" x2="315" y2="228"/>
    <line x1="555" y1="150" x2="555" y2="228"/>
    <line x1="795" y1="150" x2="795" y2="228"/>
  </g>
  <rect x="215" y="230" width="200" height="78" rx="8" fill="#ffffff" stroke="#b45309" stroke-width="1.4"/>
  <text x="315" y="254" text-anchor="middle" font-weight="bold" fill="#0f172a">decided by z3</text>
  <text x="315" y="274" text-anchor="middle" font-size="12" fill="#0f172a">SAT, UNSAT or MODEL{...}</text>
  <text x="315" y="293" text-anchor="middle" font-size="12" fill="#475569">tag [z3]</text>

  <rect x="455" y="230" width="200" height="78" rx="8" fill="#ffffff" stroke="#15803d" stroke-width="1.4"/>
  <text x="555" y="254" text-anchor="middle" font-weight="bold" fill="#0f172a">decided by lean</text>
  <text x="555" y="274" text-anchor="middle" font-size="12" fill="#0f172a">PROVED</text>
  <text x="555" y="293" text-anchor="middle" font-size="12" fill="#475569">tag [lean]</text>

  <rect x="695" y="230" width="200" height="78" rx="8" fill="#ffffff" stroke="#be185d" stroke-width="1.4"/>
  <text x="795" y="254" text-anchor="middle" font-weight="bold" fill="#0f172a">decided by sas</text>
  <text x="795" y="274" text-anchor="middle" font-size="12" fill="#0f172a">PROVED, ALARM or UNKNOWN</text>
  <text x="795" y="293" text-anchor="middle" font-size="12" fill="#475569">tag [sas]</text>

  <text x="450" y="352" text-anchor="middle" font-size="12" fill="#475569">The first prover that returns something other than Unknown decides the goal.</text>
  <text x="450" y="372" text-anchor="middle" font-size="12" fill="#475569">pcc.zig turns the verdict into an OmegaConfirmed derivation and a Z3 / Lean / SAS certificate.</text>
</svg>
