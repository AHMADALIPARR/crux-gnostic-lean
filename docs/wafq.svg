<svg xmlns="http://www.w3.org/2000/svg" width="560" height="470" viewBox="0 0 560 470" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <title>WAFQ_ALLAH_3X3 with its row, column and diagonal sums</title>
  <rect x="0" y="0" width="560" height="470" fill="#ffffff"/>
  <text x="280" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#0f172a">WAFQ_ALLAH_3X3</text>
  <text x="280" y="54" text-anchor="middle" font-size="12" fill="#475569">constant_sum 33 · Wafq.verify = false</text>


  <!-- grid -->
  <g stroke="#334155" stroke-width="1.5" fill="#fefce8">
    <rect x="130" y="100" width="80" height="80"/>
    <rect x="210" y="100" width="80" height="80"/>
    <rect x="290" y="100" width="80" height="80"/>
    <rect x="130" y="180" width="80" height="80"/>
    <rect x="210" y="180" width="80" height="80"/>
    <rect x="290" y="180" width="80" height="80"/>
    <rect x="130" y="260" width="80" height="80"/>
    <rect x="210" y="260" width="80" height="80"/>
    <rect x="290" y="260" width="80" height="80"/>
  </g>
  <!-- diagonal guides -->
  <line x1="130" y1="100" x2="370" y2="340" stroke="#16a34a" stroke-width="2" stroke-opacity="0.8" stroke-dasharray="6 4"/>
  <line x1="370" y1="100" x2="130" y2="340" stroke="#dc2626" stroke-width="2" stroke-opacity="0.8" stroke-dasharray="6 4"/>
  <g font-size="26" font-weight="bold" text-anchor="middle" fill="#0f172a" stroke="#fefce8" stroke-width="6" paint-order="stroke">
    <text x="170" y="149">8</text>
    <text x="250" y="149">1</text>
    <text x="330" y="149">24</text>
    <text x="170" y="229">15</text>
    <text x="250" y="229">11</text>
    <text x="330" y="229">7</text>
    <text x="170" y="309">10</text>
    <text x="250" y="309">21</text>
    <text x="330" y="309">2</text>
  </g>

  <!-- row sums -->
  <g fill="#1d4ed8" font-weight="bold">
    <text x="392" y="146">row = 33</text>
    <text x="392" y="226">row = 33</text>
    <text x="392" y="306">row = 33</text>
  </g>
  <!-- column sums -->
  <g fill="#1d4ed8" font-weight="bold" text-anchor="middle">
    <text x="170" y="368">33</text>
    <text x="250" y="368">33</text>
    <text x="330" y="368">33</text>
  </g>
  <text x="40" y="368" font-size="12" fill="#475569">column sums</text>

  <!-- diagonal sums -->
  <text x="376" y="362" font-weight="bold" fill="#16a34a">diagonal 8+11+2 = 21</text>
  <text x="376" y="80" font-weight="bold" fill="#dc2626">anti-diagonal</text>
  <text x="376" y="98" font-weight="bold" fill="#dc2626">24+11+10 = 45</text>

  <text x="280" y="414" text-anchor="middle" font-size="12" fill="#475569">Rows and columns all reach 33; the diagonals give 21 and 45, so verify returns false.</text>
  <text x="280" y="434" text-anchor="middle" font-size="12" fill="#475569">Values from GnosticArabic/AbjadMatrix.lean and zig/src/abjad.zig (crux abjad wafq).</text>
</svg>
